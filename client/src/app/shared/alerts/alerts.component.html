@if (message()) {
  <div class="min-h-0 overflow-hidden">
    <div [class]="spacing()">
      <div
        [attr.role]="shouldShowSuccessAlert() ? 'status' : 'alert'"
        [class]="shouldShowSuccessAlert()
          ? 'border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-300'
          : 'border-red-200 bg-red-50 text-red-800 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300'"
        class="flex items-start justify-between gap-4 rounded-lg border border-solid px-4 py-3 text-[13px] leading-[1.5]"
      >
        <span>{{ message() }}</span>
        <button
          type="button"
          (click)="dismissed.emit()"
          aria-label="Dismiss message"
          class="cursor-pointer border-0 bg-transparent p-0 text-lg leading-none text-current opacity-70 hover:opacity-100"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    </div>
  </div>
}
