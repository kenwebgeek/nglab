<section
  aria-labelledby="login-heading"
  class="flex w-full max-w-[480px] flex-col gap-7 rounded-[14px] border border-solid border-[#e2e8f0] bg-white
  p-6 shadow-[0_8px_24px_rgba(15,23,42,0.04)] sm:p-10 dark:border-[#2c3850] dark:bg-[#131c2d]"
>
  <div class="flex flex-col gap-2">
    <p class="m-0 text-[11px] font-semibold uppercase leading-[1.5] tracking-[0.08em] text-[#4f46e5] dark:text-[#a99aff]">
      Workspace access
    </p>
    <h1 id="login-heading" class="m-0 text-[30px] font-semibold leading-[1.2] text-[#172033] dark:text-[#f3f5fc]">
      Welcome back
    </h1>
    <p class="m-0 text-sm leading-[1.5] text-[#58657a] dark:text-[#a2aec3]">Log in to manage your workspace and users.</p>
  </div>

  @if (store.notice(); as notice) {
    <app-alerts
      animate.leave="animate-alert-out motion-reduce:animate-none"
      alert="success"
      [message]="notice"
      (dismissed)="store.dismissNotice()"
    />
  }

  <app-login-form
    [submitting]="store.submitting()"
    [errorMessage]="store.error()"
    (submitted)="store.login($event)"
    (errorDismissed)="store.dismissError()"
  />
  <a routerLink="/resend-verification" class="text-sm font-semibold text-[#4f46e5] no-underline hover:underline dark:text-[#a99aff]">
    Resend verification email
  </a>
</section>

<p class="m-0 flex gap-[6px] text-sm leading-[1.5] text-[#58657a] dark:text-[#a2aec3]">
  Don't have an account?
  <a routerLink="/signup" class="font-semibold text-[#4f46e5] no-underline hover:underline dark:text-[#a99aff]">Sign up</a>
</p>
