<section aria-labelledby="resend-heading" class="flex w-full max-w-[480px] flex-col gap-6 rounded-[14px] border border-solid border-[#e2e8f0] bg-white p-6 sm:p-10 dark:border-[#2c3850] dark:bg-[#131c2d]">
  <h1 id="resend-heading" class="m-0 text-[30px] font-semibold text-[#172033] dark:text-[#f3f5fc]">Verify your email</h1>
  <p>Enter your account email to request another verification link.</p>
  @if (sent()) {
    <app-alerts alert="success" message="If an unverified account exists for that email, a verification link will be sent. If it does not arrive, try again later." />
    <button type="button" (click)="sent.set(false)" class="font-semibold text-[#4f46e5] dark:text-[#a99aff]">Try again</button>
  } @else {
    @if (error(); as message) {
      <app-alerts alert="error" [message]="message" (dismissed)="error.set(null)" />
    }
    <form [formGroup]="form" (ngSubmit)="resend()" novalidate class="flex flex-col gap-4">
      <label for="verification-email" class="text-sm font-medium">Email *</label>
      <input id="verification-email" type="email" autocomplete="email" formControlName="email" aria-required="true"
        [attr.aria-invalid]="form.controls.email.invalid && (form.controls.email.dirty || form.controls.email.touched)"
        class="h-12 w-full rounded-lg border border-solid border-[#cbd5e1] bg-[#f8fafc] px-[14px] dark:border-[#2c3850] dark:bg-[#0e1625] dark:text-[#f3f5fc]" />
      @if (form.controls.email.invalid && (form.controls.email.dirty || form.controls.email.touched)) {
        <p class="m-0 text-xs text-red-500">Enter a valid email address.</p>
      }
      <button type="submit" [disabled]="submitting()" class="h-12 rounded-lg border-0 bg-[#4f46e5] font-semibold text-white disabled:opacity-60">
        {{ submitting() ? 'Sending link…' : 'Send verification link' }}
      </button>
    </form>
  }
</section>
<a routerLink="/login" class="text-sm font-semibold text-[#4f46e5] dark:text-[#a99aff]">Back to login</a>
