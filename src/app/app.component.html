<div class="h-screen overflow-hidden" [class.dark]="isDarkMode()">
  <div class="flex h-full bg-[#f5f7fb] dark:bg-[#0b1220]">
    <app-sidebar class="block h-full shrink-0"></app-sidebar>
    <div class="flex min-w-0 flex-1 flex-col">
      <app-breadcrumb-bar
        class="block shrink-0"
        [isDarkMode]="isDarkMode()"
        (darkModeToggled)="toggleDarkMode()"
      ></app-breadcrumb-bar>
      <main class="min-h-0 flex-1 overflow-y-auto">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
