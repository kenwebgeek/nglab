<header
  class="flex h-[72px] items-center justify-between border-0 border-b border-solid
  border-[#e3e8f0] bg-white px-10 font-inter [&_*]:font-inter dark:border-[#1f2937] dark:bg-[#0f172a]"
>
  <nav class="flex items-center gap-[10px]" aria-label="Breadcrumb">
    <span class="text-xs text-[#7c879a] dark:text-[#94a3b8]">Workspace</span>
    <img src="assets/icons/chevron-right.svg" alt="" width="13" height="13" class="dark:hidden" />
    <img src="assets/icons/chevron-right-dark.svg" alt="" width="13" height="13" class="hidden dark:block" />
    <span class="text-xs font-medium text-[#172033] dark:text-[#e5e7eb]" aria-current="page">Users</span>
  </nav>

  <button
    type="button"
    aria-label="Toggle dark mode"
    [attr.aria-pressed]="isDarkMode()"
    (click)="darkModeToggled.emit()"
    class="flex size-8 items-center justify-center rounded-md border-0 bg-transparent
    hover:bg-slate-100 dark:hover:bg-[#1f2937]"
  >
    <img src="assets/icons/moon.svg" alt="" width="17" height="17" class="dark:hidden" />
    <img src="assets/icons/moon-dark.svg" alt="" width="17" height="17" class="hidden dark:block" />
  </button>
</header>
