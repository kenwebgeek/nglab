<header
  class="flex h-[72px] items-center justify-between border-0 border-b border-solid
  border-[#e3e8f0] bg-white px-10 font-inter [&_*]:font-inter dark:border-slate-600 dark:bg-slate-800"
>
  <nav class="flex items-center gap-[10px]" aria-label="Breadcrumb">
    <span class="text-xs text-[#7c879a] dark:text-slate-400">Workspace</span>
    <img src="assets/icons/chevron-right.svg" alt="" width="13" height="13" />
    <span class="text-xs font-medium text-[#172033] dark:text-slate-50" aria-current="page">Users</span>
  </nav>

  <button
    type="button"
    aria-label="Toggle dark mode"
    class="flex size-8 items-center justify-center rounded-md border-0 bg-transparent
    hover:bg-slate-100 dark:hover:bg-slate-600"
  >
    <img src="assets/icons/moon.svg" alt="" width="17" height="17" />
  </button>
</header>
