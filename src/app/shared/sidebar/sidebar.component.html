<aside
  class="flex h-full min-h-0 w-[216px] flex-col justify-between overflow-y-auto border-0 border-r border-solid
  border-[#e3e8f0] bg-white font-inter [&_*]:font-inter dark:border-[#1f2937] dark:bg-[#0f172a]"
>
  <div class="flex flex-col">
    <div class="flex h-[72px] items-center gap-[10px] px-6">
      <div
        class="flex h-8 w-[30px] items-center justify-center rounded-lg bg-[#4f46e5] text-[19px]
        font-bold text-white"
        aria-hidden="true"
      >
        A
      </div>
      <span class="whitespace-nowrap text-[17px] text-[#172033] dark:text-[#ecf0fa]">Angular Lab</span>
    </div>

    <nav class="flex flex-col gap-[14px] px-4 pt-8" aria-label="Workspace">
      <p class="m-0 text-[10px] font-semibold text-[#7c879a] dark:text-[#94a3b8]">WORKSPACE</p>
      <div
        class="flex h-[42px] items-center gap-[10px] rounded-lg bg-[#eeedff] px-3 dark:bg-[#1d1b4a]"
        aria-current="page"
      >
        <img src="assets/icons/users.svg" alt="" width="18" height="18" />
        <span class="flex-1 text-[13px] font-semibold text-[#4338ca] dark:text-[#c4b5fd]">Users</span>
        <span class="text-[11px] font-semibold text-[#4338ca] dark:text-[#c4b5fd]">10</span>
      </div>
    </nav>
  </div>

  <div class="flex flex-col gap-5 p-6">
    <div class="flex items-center gap-[10px]">
      <img src="assets/icons/circle-help.svg" alt="" width="18" height="18" class="dark:hidden" />
      <img src="assets/icons/circle-help-dark.svg" alt="" width="18" height="18" class="hidden dark:block" />
      <span class="whitespace-nowrap text-xs text-[#58657a] dark:text-[#94a3b8]">Help &amp; support</span>
    </div>
    <div
      class="flex items-center gap-2 border-0 border-t border-solid border-[#e3e8f0] pt-[18px]
      dark:border-[#1f2937]"
    >
      <img src="assets/icons/layers-2.svg" alt="" width="14" height="14" class="dark:hidden" />
      <img src="assets/icons/layers-2-dark.svg" alt="" width="14" height="14" class="hidden dark:block" />
      <span class="whitespace-nowrap text-[11px] text-[#7c879a] dark:text-[#94a3b8]">User management</span>
    </div>
  </div>
</aside>
