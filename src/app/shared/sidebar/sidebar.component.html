<aside
  class="flex h-full min-h-0 w-[216px] flex-col justify-between overflow-y-auto border-0 border-r border-solid
  border-[#e3e8f0] bg-white font-inter [&_*]:font-inter dark:border-slate-600 dark:bg-slate-800"
>
  <div class="flex flex-col">
    <div class="flex h-[72px] items-center gap-[10px] px-6">
      <div
        class="flex h-8 w-[30px] items-center justify-center rounded-lg bg-[#4f46e5] text-[19px]
        font-bold text-white"
        aria-hidden="true"
      >
        A
      </div>
      <span class="whitespace-nowrap text-[17px] text-[#172033] dark:text-slate-50">Angular Lab</span>
    </div>

    <nav class="flex flex-col gap-[14px] px-4 pt-8" aria-label="Workspace">
      <p class="m-0 text-[10px] font-semibold text-[#7c879a] dark:text-slate-400">WORKSPACE</p>
      <div
        class="flex h-[42px] items-center gap-[10px] rounded-lg bg-[#eeedff] px-3"
        aria-current="page"
      >
        <img src="assets/icons/users.svg" alt="" width="18" height="18" />
        <span class="flex-1 text-[13px] font-semibold text-[#4338ca]">Users</span>
        <span class="text-[11px] font-semibold text-[#4338ca]">10</span>
      </div>
    </nav>
  </div>

  <div class="flex flex-col gap-5 p-6">
    <div class="flex items-center gap-[10px]">
      <img src="assets/icons/circle-help.svg" alt="" width="18" height="18" />
      <span class="whitespace-nowrap text-xs text-[#58657a] dark:text-slate-300">Help &amp; support</span>
    </div>
    <div
      class="flex items-center gap-2 border-0 border-t border-solid border-[#e3e8f0] pt-[18px]
      dark:border-slate-600"
    >
      <img src="assets/icons/layers-2.svg" alt="" width="14" height="14" />
      <span class="whitespace-nowrap text-[11px] text-[#7c879a] dark:text-slate-400">User management</span>
    </div>
